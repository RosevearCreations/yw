<p id="yw602LoginStatus" role="status" aria-live="polite">No property data loaded.</p>
<button id="yw602Logout" type="button" hidden>Sign out</button>
<section id="yw602CustomerPortal" hidden></section>
<p><a href="/">Return to Yard Workers</a></p></main>
