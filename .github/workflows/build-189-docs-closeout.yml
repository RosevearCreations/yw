name: Build 189 docs closeout

on:
  push:
    branches:
      - build-189-release-closeout

permissions:
  contents: write

jobs:
  converge-docs:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: build-189-release-closeout
      - name: Converge canonical Build 189 authority
        env:
          SECTION_B64: 
        run: |
          python - <<'PY'
          import base64
          from pathlib import Path
          import os

          section = base64.b64decode(os.environ['SECTION_B64']).decode('utf-8')
          for name in ['README.md', 'docs/ACTIVE_PROJECT_HANDBOOK.md', 'docs/NEXT_STEPS_AND_SANITY_CHECK.md']:
              p = Path(name)
              text = p.read_text(encoding='utf-8')
              if '## Build 189 final release authority' in text:
                  continue
              first_nl = text.find('\n')
              if first_nl < 0:
                  raise SystemExit(f'Missing H1 line in {name}')
              text = text[:first_nl+1] + '\n' + section + text[first_nl+1:]
              p.write_text(text, encoding='utf-8')
          PY
          rm .github/workflows/build-189-docs-closeout.yml
          git config user.name "John Rosevear"
          git config user.email "jfrosevear@gmail.com"
          git add -A
          git commit -m "Converge Build 189 canonical release authority [skip ci]"
          git push origin HEAD:build-189-release-closeout
