name: YW583 seven-service source/runtime parity and independent pilot guard
on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  seven-service-parity:
    name: YW583 six-to-seven historical source and staging photo pilot
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Verify historical sequence, read-only SQL and fail-closed independent pilot
        run: node scripts/yw583-parity-pilot-check.mjs
