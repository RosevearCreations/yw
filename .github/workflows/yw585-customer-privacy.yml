name: YW585 public customer foundation and original-record privacy

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  yw585-customer-privacy:
    name: YW585 public customer planning and original CRM privacy
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Test public-local planning, customer membership RLS and staging photo guards
        run: node scripts/yw585-customer-contract-check.mjs

  yw585-customer-browser:
    name: YW585 real customer planning browser acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      - name: Install reviewed repository test dependencies
        run: npm ci --no-audit --no-fund
      - name: Install pinned Chromium without APT mutation
        shell: bash
        run: |
          set -euo pipefail
          install_ok=false
          for attempt in 1 2 3; do
            if timeout --kill-after=10s 150s npx playwright install chromium; then
              install_ok=true
              break
            fi
            if [ "$attempt" -lt 3 ]; then sleep 10; fi
          done
          test "$install_ok" = true
      - name: Test actual mobile/tablet/desktop customer planning and offline privacy
        run: npx playwright test --config=playwright.config.mjs tests/browser/yw585-customer-local-planner.spec.mjs
