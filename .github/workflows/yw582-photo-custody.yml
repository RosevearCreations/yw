name: YW582 independent staging and private photo source proof

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  yw582-custody-security:
    name: YW582 original job, staging and photo custody security
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Test independent original identity and non-production custody boundaries
        run: node scripts/yw582-photo-custody-check.mjs
