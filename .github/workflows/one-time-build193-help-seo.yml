name: One-time Build 193 help and SEO implementation

on:
  push:
    branches:
      - schema-193-help-seo-hygiene

permissions:
  contents: write

jobs:
  implement:
    if: ${{ !contains(github.event.head_commit.message, '[build193-implemented]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: schema-193-help-seo-hygiene
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply current Help, documentation and SEO authority
        run: python scripts/one-time-build193-implement.py
      - name: Verify new source gates before committing
        run: |
          npm run test:help-seo
          npm run test:repo
      - name: Commit implementation
        run: |
          git config user.name "John Rosevear"
          git config user.email "jfrosevear@gmail.com"
          git add -A
          git commit -m "Build 193: current Help SEO and responsive H1 authority [build193-implemented]" || exit 0
          git push origin HEAD:schema-193-help-seo-hygiene
