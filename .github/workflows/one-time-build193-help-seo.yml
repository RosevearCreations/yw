name: One-time Build 193 help and SEO implementation

on:
  push:
    branches:
      - schema-193-help-seo-hygiene

permissions:
  contents: write

jobs:
  implement:
    if: ${{ !contains(github.event.head_commit.message, '[build193-implemented]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: schema-193-help-seo-hygiene
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply current Help, documentation and SEO authority
        run: python scripts/one-time-build193-implement.py
      - name: Complete durable documentation boundary and remove bootstrap files
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('docs/NEXT_STEPS_AND_SANITY_CHECK.md')
          text = p.read_text(encoding='utf-8')
          block = '''\n## Module and Production boundary\n\nThe four top-level modules are **Safety / OHSA**, **Finance**, **Jobs**, and **Admin**. **I.T. Readiness** remains inside Admin rather than becoming another top-level module.\n\nProduction promotion remains deliberate/manual and separate from application source readiness.\n'''
          if '## Module and Production boundary' not in text:
              p.write_text(text.rstrip() + '\n' + block, encoding='utf-8')
          PY
          rm -f .github/workflows/one-time-build193-help-seo.yml scripts/one-time-build193-implement.py
      - name: Verify new source gates and JavaScript syntax
        run: |
          node --check js/public-routes.js
          node --check js/customer-portal.js
          node --check scripts/generate-public-routes.mjs
          node --check tests/browser/help-seo-layout.spec.mjs
          npm run test:help-seo
          npm run test:repo
      - name: Commit implementation
        run: |
          git config user.name "John Rosevear"
          git config user.email "jfrosevear@gmail.com"
          git add -A
          git commit -m "Build 193: current Help SEO and responsive H1 authority [build193-implemented]"
          git push origin HEAD:schema-193-help-seo-hygiene
