          nextsteps='''# Next Steps and Sanity Check

## Restart checkpoint

Start every new work session from current `dev` and `main`, then verify that their application trees are synchronized before opening another feature branch. Read current schema/release truth from I.T. Readiness rather than from historical documentation.

## Required sanity checks

Before new feature work:

- verify `dev` and `main` contain the latest accepted application tree;
- verify schema drift is current;
- verify release authority and repository-enforcement status separately;
- verify Finance execution and provider mutation remain in their intended fail-closed state;
- verify Current Admin To-Do contains only genuinely unresolved work;
- verify no business acceptance rail was auto-closed by technical/source work;
- run repository, Help/SEO and rendered mobile/desktop gates;
- remove temporary branches/workflows/files after release proof.

## Public web and Help review

Every release that changes navigation, workflows or public pages must update `/help.html` in the same change. Public/indexable pages must retain one H1, current canonical metadata, crawler-ready content, canonical-only sitemap entries and responsive phone/desktop rendering. Portal and Help surfaces remain `noindex`.

## Remaining work selection

Choose the next technical feature from a fresh I.T. Readiness / Current Admin To-Do review. Do not invent autonomous work merely to increase a score. Rails classified as human, accounting, provider, content or staging acceptance remain open until their actual evidence exists.

Repository protection is a separate enforcement concern from application release authority and should remain visible until GitHub reports it as enforced.
