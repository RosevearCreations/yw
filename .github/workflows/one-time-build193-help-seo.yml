          readme='''# Yard Weasels Inc. Operations Platform

This repository contains the Yard Weasels Inc. staff operations application, customer portal, and approved public service-page publishing layer.

## Current product boundary

The staff application has four top-level modules: **Safety / OHSA**, **Finance**, **Jobs**, and **Admin**. **I.T. Readiness** is an Admin workspace, not a fifth top-level module. Module access is permission-driven and server-side write authority remains fail-closed.

The public layer consists of the home/contact surface and approved service/location routes. Customer quote links use the separate token-protected customer portal.

## Operator help

Current in-app guidance is maintained at **`/help.html`** and linked from the application header. Help covers sign-in/recovery, mobile workflow, the four modules, offline/sync behavior, customer portal privacy, and troubleshooting. The Help page is intentionally `noindex` so operational guidance does not compete with public service content in search.

## Public search and SEO contract

Public/indexable pages must satisfy all of the following before release:

- exactly one rendered page-level `H1`;
- responsive mobile and desktop layout without horizontal overflow;
- a useful title and meta description;
- an on-site canonical URL;
- index/follow directives only for genuinely public content;
- customer portal and operational Help surfaces marked `noindex`;
- crawlable internal links and approved public content;
- sitemap entries limited to current canonical URLs with truthful `lastmod` values;
- service structured data only where the published page actually describes that service;
- stable favicon and accessible image alternative text.

The static public-route generator remains the preferred crawler path. The browser route renderer is a fallback and must preserve the same canonical, indexing, and one-H1 rules.

## Release truth

Do not copy release SHAs, workflow run numbers, or historical build numbers into active documentation. Current release/source authority belongs in GitHub and the service-private I.T. release-authority views. Current database version belongs in `v_schema_drift_status` / `app_schema_versions`.

Production promotion remains deliberate/manual. Finance posting execution and payment-provider mutation remain OFF unless a separately authorized release explicitly changes those controls. Human accounting/provider/content/staging acceptance work must not be auto-closed by source changes.

## Repository hygiene

Git history and numbered migrations are the audit trail. Do not recreate archive folders, temporary patch workflows, backup files, generated full-schema snapshots, or release-handoff Markdown. The active Markdown set is intentionally limited to this README plus the two files in `docs/`.

## Development checks

`npm run test:repo` verifies repository hygiene and durable documentation rules. `npm run test:help-seo` verifies Help/search/H1/static search controls. Rendered browser acceptance includes phone and desktop Help/app/public-page layout checks.
'''
          handbook='''# Active Project Handbook

## Purpose

This is the durable operating handbook for the Yard Weasels Inc. application. It describes current architecture and release rules only. Historical release narration belongs in Git/database history, not in this file.

## Application architecture

The protected staff application has four top-level modules:

1. **Safety / OHSA** — toolbox, PPE, first aid, incidents/near misses, inspections, drills, logbook, safety operations and reporting.
2. **Finance** — accounting review, reconciliation, close, mapping, posting readiness and accountant handoff.
3. **Jobs** — current work, crews, service execution, equipment, proof and supervisor workflows.
4. **Admin** — user/module administration, Operations controls, release/security evidence and **I.T. Readiness**.

Shared Core owns authentication, profile/session state, common data contracts, navigation, offline behavior and permission-driven module loading.

## Permission and safety boundary

A hidden screen is not a security boundary. Reads and writes must still be enforced server-side. Admin break-glass is explicit. Finance posting and provider mutation are fail-closed. Human accounting decisions, provider acceptance, content approval and staging acceptance stay human/external when their contracts require it.

## Online Help

`/help.html` is the maintained operator guide. It must remain usable on phone and desktop, contain exactly one H1, and stay `noindex`. The app header must always expose a Help link. When workflows change materially, Help changes in the same source release.

## Public web/search boundary

The home page and approved service/location pages are the only search-oriented surfaces. Customer portal tokens, operational Help and internal application routes are not search landing pages.

Public pages require: one H1, descriptive title/description, same-origin canonical, index/follow directive, responsive layout, crawlable links, accessible images, approved content, and canonical-only sitemap entries with accurate freshness. Static public route HTML is preferred so search engines do not depend on a client-side request to discover primary content.

## Mobile, PC application and webpage layout

- **Phone:** bottom module shortcuts, Today-first workflow, touch-friendly form controls, local draft/offline guidance and no horizontal overflow.
- **Desktop application:** full module navigation, wider workspaces, readable tables/cards and the same permission model as mobile.
- **Public webpage:** responsive content and contact paths, one H1, stable canonical/metadata, crawlable content and no exposure of internal planning copy.

## Data and release authority

Numbered SQL migrations are retained permanently as schema history. The live schema state is read from database authority views rather than copied here. GitHub source checks and the service-private release-source evidence table hold exact source/run proof.

Production promotion is deliberate/manual. A source release must not enable Finance execution, provider mutation, or close human/external acceptance rails unless that specific change is separately authorized and evidenced.

## Hygiene rules

Keep only active files in the working tree. Temporary workflows, test-write files, backup/log files, retired Markdown, archive directories and generated schema snapshots are prohibited. Historical comments inside migrations are audit evidence and are not rewritten merely to remove old wording.
