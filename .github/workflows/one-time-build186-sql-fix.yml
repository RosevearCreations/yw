name: One-time Build 186 SQL fix

on:
  push:
    branches: [schema-186-staging-acceptance-control-plane]
    paths:
      - '.github/workflows/one-time-build186-sql-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: schema-186-staging-acceptance-control-plane
      - name: Rename reserved CTE
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('sql/186_staging_acceptance_control_plane.sql')
          s = p.read_text()
          old = s
          s = s.replace('), current_schema as (', '), schema_state as (')
          s = s.replace('cross join current_schema cs', 'cross join schema_state cs')
          if s == old:
              raise SystemExit('Expected current_schema CTE markers were not found.')
          if 'current_schema' in s:
              raise SystemExit('Unexpected current_schema marker remains after patch.')
          p.write_text(s)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sql/186_staging_acceptance_control_plane.sql
          git commit -m 'Fix Schema 186 reserved CTE name'
          git push origin HEAD:schema-186-staging-acceptance-control-plane
