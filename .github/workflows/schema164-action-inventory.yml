name: Schema 164 action inventory

on:
  push:
    branches:
      - schema-164-cross-module-write-boundaries

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inventory explicitly handled operations actions
        shell: bash
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const text = fs.readFileSync('supabase/functions/operations-manage/index.ts','utf8');
          const actions = new Set();
          for (const match of text.matchAll(/action\s*===\s*['"]([^'"]+)['"]/g)) actions.add(match[1]);
          const ordered = [...actions].sort();
          console.log(`SCHEMA164_ACTION_COUNT=${ordered.length}`);
          for (const action of ordered) console.log(`SCHEMA164_ACTION=${action}`);
          NODE