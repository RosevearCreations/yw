name: One-time Schema 184 branch prune

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-schema184-branch-prune.yml'

permissions:
  contents: write

jobs:
  prune:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Delete completed Build 184 branches
        run: git push origin --delete schema-184-it-scorecard-truth-convergence schema-184-authority-closeout
