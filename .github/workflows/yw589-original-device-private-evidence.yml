name: YW589 authenticated original device photo and independent dispatcher acceptance
on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-device-security:
    name: YW589 actual Edge handler private bytes/idempotency/tenant and finance negative tests
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Exercise real Deno handler on disposable simulated Auth, DB, and Storage
        run: node scripts/yw589-original-device-security-check.mjs
  original-device-browser:
    name: YW589 original device photo controls and authorized dispatcher browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install chromium
      - name: Accept mobile camera and dispatcher review with revoked session
        run: npx playwright test --config=playwright.config.mjs tests/browser/yw589-original-device-photo.spec.mjs
