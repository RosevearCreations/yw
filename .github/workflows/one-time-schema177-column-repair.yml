name: One-time Schema 177 migration column repair

on:
  push:
    branches:
      - schema-177-migration-column-repair

permissions:
  contents: write

jobs:
  repair:
    if: github.repository == 'RosevearCreations/yw'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: schema-177-migration-column-repair
      - name: Repair duplicate execution status column and strengthen source gate
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          migration = Path('sql/177_finance_posting_execution_recovery.sql')
          text = migration.read_text()
          old = "  r.execution_status,\n  r.attempt_count,"
          new = "  r.execution_status as posting_execution_status,\n  r.attempt_count,"
          if old not in text:
              raise SystemExit('Expected duplicate execution_status projection not found.')
          migration.write_text(text.replace(old, new, 1))

          gate = Path('scripts/finance-posting-execution-recovery-check.mjs')
          gate_text = gate.read_text()
          marker = "console.log('Schema 177 Finance posting execution/recovery source gate passed.');"
          assertion = "assert.ok(migration.includes('r.execution_status as posting_execution_status'),'Schema 177 execution queue must alias the run status instead of colliding with Schema 175 execution_status.');\n\n"
          if assertion not in gate_text:
              if marker not in gate_text:
                  raise SystemExit('Schema 177 gate completion marker not found.')
              gate.write_text(gate_text.replace(marker, assertion + marker, 1))
          PY
          git rm .github/workflows/one-time-schema177-column-repair.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sql/177_finance_posting_execution_recovery.sql scripts/finance-posting-execution-recovery-check.mjs
          git commit -m "Repair Schema 177 execution queue column collision"
          git push origin HEAD:schema-177-migration-column-repair
