          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md docs/ACTIVE_PROJECT_HANDBOOK.md docs/NEXT_STEPS_AND_SANITY_CHECK.md
          git commit -m 'Close Build 187 canonical release authority'
          git push origin HEAD:schema-187-release-authority-closeout
