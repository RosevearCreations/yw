              '',
          ])

          for p in files:
              s = p.read_text()
              s = re.sub(r'## Build 187 active authority\n.*?(?=## Build 186 final release authority)', completed + '\n', s, count=1, flags=re.S)
              s = s.replace('current live authority is Build 186 / Schema 186', 'current live authority is Build 187 / Schema 187')
