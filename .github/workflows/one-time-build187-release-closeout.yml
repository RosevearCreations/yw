          s = s.replace('- Schema 187 / Build 187 — **ACTIVE SOURCE WORK**: six-rail staging scenario catalog, pending-case seeding, prerequisite truth, explicit human case evidence and fail-closed finalization.', '- Schema 187 / Build 187 — **COMPLETE**: six-rail staging scenario catalog, pending-case seeding, prerequisite truth, explicit human case evidence, fail-closed finalization, and exact-main release authority.')
