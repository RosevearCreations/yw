name: YW595 original supervised field, signed receiver custody and two-tenant isolation
on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-dual-company-field-and-rotation-gates:
    name: Original supervised ceremony, distinct reviewers, genuine Master contract, separate tenants
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Existing YW593 original witness baseline
        run: node scripts/yw593-field-recovery-check.mjs
      - name: Existing YW594 human/receiver validation
        run: node scripts/yw594-field-evidence-drift-check.mjs
      - name: YW595 real original-field ceremony and two-tenant HOLD
        run: node scripts/yw595-original-pilot-rotation-fleet-check.mjs
