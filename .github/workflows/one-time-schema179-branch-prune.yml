name: One-time Schema 179 branch prune

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-schema179-branch-prune.yml'

permissions:
  contents: write

jobs:
  prune:
    runs-on: ubuntu-latest
    steps:
      - name: Verify repository and delete merged Schema 179 branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "RosevearCreations/yw"
          branch="schema-179-finance-permissions-acceptance-release-hardening"
          test "$branch" != "main"
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$branch" >/dev/null 2>&1; then
            gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$branch"
          fi
