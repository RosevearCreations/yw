name: Build 180 closeout patch

on:
  push:
    branches: [schema-180-authority-closeout]
    paths:
      - '.github/workflows/build180-closeout-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: schema-180-authority-closeout
      - name: Align Build 180 closeout gate
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('scripts/repo-smoke-check.mjs')
          s=p.read_text()
          old="add('docs-build180-active',[readme,handbook,nextSteps].every((text)=>text.includes('Build 180')&&/mapping/i.test(text)&&/active/i.test(text)),'Active authority records Build 180 accountant mapping readiness/review as the active source release.');"
          new="add('docs-build180-complete',[readme,handbook,nextSteps].every((text)=>text.includes('Build 180')&&/mapping/i.test(text)&&/COMPLETE/i.test(text)),'Active authority records Build 180 accountant mapping readiness/review as complete.');\nadd('docs-build181-next',[readme,handbook,nextSteps].every((text)=>text.includes('Build 181')&&/aging|drift|reconciliation/i.test(text)&&/next/i.test(text)),'Active authority advances the next bounded release to Build 181 mapping observability.');"
          if old not in s: raise SystemExit('expected Build 180 active gate not found')
          p.write_text(s.replace(old,new,1))
          Path('.github/workflows/build180-closeout-patch.yml').unlink()
          PY
          git config user.name 'YWI Build 180 closeout'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Close Build 180 repository authority and advance Build 181'
          git push origin HEAD:schema-180-authority-closeout
