name: Schema 159 bootstrap

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: github.head_ref == 'schema-159-module-permissions'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: schema-159-module-permissions

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Reconstruct and verify Schema 159 patch
        shell: bash
        run: |
          set -euo pipefail
          cat .schema159-bootstrap/clean15_*.b64 > /tmp/schema159.patch.xz.b64
          echo 'aba34237d7018b6ec6b3acda89eafcb31255f0910f9725cc037d9665708b3623  /tmp/schema159.patch.xz.b64' | sha256sum -c -
          base64 --decode /tmp/schema159.patch.xz.b64 > /tmp/schema159.patch.xz
          xz --decompress --stdout /tmp/schema159.patch.xz > /tmp/schema159.patch
          echo '35ac949c4d71b4210b17a0d4fd071171ead7a23f66aed06d3cba0bef1f144d4f  /tmp/schema159.patch' | sha256sum -c -
          git apply --check /tmp/schema159.patch
          git apply /tmp/schema159.patch
          rm -rf .schema159-bootstrap
          rm -f .github/workflows/schema159-bootstrap.yml

      - name: Normalize portable Node dependencies
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          lock = Path('package-lock.json')
          lock_text = lock.read_text(encoding='utf-8')
          old_registry = 'https://packages.applied-caas-gateway1.internal.api.openai.org/artifactory/api/npm/npm-public/'
          public_registry = 'https://registry.npmjs.org/'
          count = lock_text.count(old_registry)
          if count:
              lock.write_text(lock_text.replace(old_registry, public_registry), encoding='utf-8')
          print(f'Normalized {count} private npm registry reference(s).')
          if old_registry in lock.read_text(encoding='utf-8'):
              raise SystemExit('Private npm registry reference remains in package-lock.json')

          package_path = Path('package.json')
          package = json.loads(package_path.read_text(encoding='utf-8'))
          package.setdefault('devDependencies', {})['typescript'] = '5.9.2'
          package_path.write_text(json.dumps(package, indent=2) + '\n', encoding='utf-8')

          smoke_path = Path('scripts/repo-smoke-check.mjs')
          smoke = smoke_path.read_text(encoding='utf-8')
          old = "try { ts = require('typescript'); } catch { ts = require('/opt/nvm/versions/node/v22.16.0/lib/node_modules/typescript'); }"
          new = "ts = require('typescript');"
          if old not in smoke:
              raise SystemExit('Expected local TypeScript fallback was not found in repo-smoke-check.mjs')
          smoke_path.write_text(smoke.replace(old, new), encoding='utf-8')
          PY
          npm config set registry https://registry.npmjs.org/
          npm config set fetch-retries 5
          npm config set fetch-retry-mintimeout 10000
          npm config set fetch-retry-maxtimeout 60000
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify module permission boundaries
        run: npm run test:modules

      - name: Verify repository smoke suite
        run: npm run test:repo

      - name: Verify Operations Cockpit contrast
        run: npm run test:contrast

      - name: Verify navigation priority
        run: npm run test:navigation

      - name: Commit validated Schema 159 application tree
        shell: bash
        run: |
          set -euo pipefail
          # The GitHub Actions token can write repository contents but cannot
          # create/update workflow files. Keep workflow paths unchanged in this
          # bot commit; ChatGPT's GitHub connector will finalize those two files.
          git checkout HEAD -- .github/workflows/schema159-bootstrap.yml
          rm -f .github/workflows/staging-browser-integration.yml

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --name-only | grep -q '^\.github/workflows/'; then
            echo 'Workflow path unexpectedly staged; refusing bot push.'
            git diff --cached --name-only
            exit 1
          fi
          git diff --cached --quiet && { echo 'No Schema 159 changes to commit'; exit 1; }
          git commit -m 'Schema 159: modular permissions for Safety, Finance, Jobs and Admin'
          git push origin HEAD:schema-159-module-permissions
