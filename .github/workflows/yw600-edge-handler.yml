name: YW600 actual Edge handler acceptance
on:
  pull_request:
    branches: [dev, main]
permissions:
  contents: read
jobs:
  edge-handler:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: node scripts/yw600-edge-handler-check.mjs
