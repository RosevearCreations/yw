name: One-time Schema 183 branch prune

on:
  push:
    paths:
      - '.github/workflows/one-time-schema183-branch-prune.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prune:
    runs-on: ubuntu-latest
    steps:
      - name: Delete completed Schema 183 branches
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          for branch in schema-183-authority-closeout schema-183-finance-mapping-decision-support; do
            code=$(curl -sS -o /tmp/prune-response -w "%{http_code}" \
              -X DELETE \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${REPO}/git/refs/heads/${branch}")
            if [ "$code" != "204" ] && [ "$code" != "422" ]; then
              cat /tmp/prune-response
              exit 1
            fi
          done
