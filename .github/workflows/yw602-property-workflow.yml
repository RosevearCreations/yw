name: YW602 shell isolation, property map and authorized change order acceptance
on:
  pull_request:
    branches: [dev, main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  isolated-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-only-not-a-production-secret
          POSTGRES_DB: yw602_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d yw602_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Apply exact migration in empty disposable database and test role/tenant boundaries
        env:
          PGPASSWORD: ci-only-not-a-production-secret
          PGHOST: 127.0.0.1
          PGPORT: "5432"
          PGUSER: postgres
          PGDATABASE: yw602_ci
        run: psql -X -v ON_ERROR_STOP=1 -f scripts/yw602-isolated-postgres-check.sql
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: node --check js/yw602-workspace.js && node --check js/yw602-property-portal.js && node --check js/yw602-customer-entry.js
      - run: npx playwright test --config=playwright.config.mjs tests/browser/yw602-property-portal.spec.mjs tests/browser/dual-workspace-550.spec.mjs
      - run: npm run build:vercel
      - name: Verify dedicated private entry and exact thumbnail asset publication
        run: |
          test -f dist/property-portal.html
          test -f dist/theme-yw602.css
          cmp public/images/yw602/field.webp dist/images/yw602/field.webp
          cmp public/images/yw602/control.webp dist/images/yw602/control.webp
