name: Schema 160 authority sync

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  sync-authority:
    if: github.head_ref == 'schema-160-it-readiness-admin-repair'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Schema 160 branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: schema-160-it-readiness-admin-repair

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Append canonical migration and bump static markers
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          canonical = Path('sql/000_full_schema_reference.sql')
          migration = Path('sql/160_it_readiness_admin_access_integrity.sql').read_text(encoding='utf-8').strip()
          text = canonical.read_text(encoding='utf-8')
          marker = 'BEGIN MIGRATION: 160_it_readiness_admin_access_integrity'
          if marker not in text:
              block = (
                  '\n\n-- -----------------------------------------------------------------------------\n'
                  '-- BEGIN MIGRATION: 160_it_readiness_admin_access_integrity\n'
                  '-- -----------------------------------------------------------------------------\n'
                  + migration
                  + '\n-- -----------------------------------------------------------------------------\n'
                  '-- END MIGRATION: 160_it_readiness_admin_access_integrity\n'
                  '-- -----------------------------------------------------------------------------\n'
              )
              canonical.write_text(text.rstrip() + block, encoding='utf-8')

          index = Path('index.html')
          index_text = index.read_text(encoding='utf-8')
          index.write_text(index_text.replace('2026-09-01a', '2026-09-01b'), encoding='utf-8')

          routes = Path('scripts/generate-public-routes.mjs')
          route_text = routes.read_text(encoding='utf-8')
          routes.write_text(route_text.replace("const build = '2026-09-01a';", "const build = '2026-09-01b';"), encoding='utf-8')
          PY

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify Schema 160 source
        run: |
          npm run test:modules
          npm run test:it
          npm run test:repo
          npm run test:contrast
          npm run test:navigation

      - name: Commit generated authority files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sql/000_full_schema_reference.sql index.html scripts/generate-public-routes.mjs
          if git diff --cached --quiet; then
            echo 'Schema 160 authority files already synchronized.'
            exit 0
          fi
          git commit -m 'Schema 160: synchronize canonical schema and static release markers'
          git push origin HEAD:schema-160-it-readiness-admin-repair
