name: One-time Build 188 documentation closeout

on:
  push:
    branches: [build-188-release-closeout]
    paths:
      - '.github/workflows/one-time-build188-doc-closeout.yml'

permissions:
  contents: write

jobs:
  closeout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: build-188-release-closeout
      - name: Converge canonical Build 188 authority
        run: python scripts/.tmp_build188_docs.py
      - name: Commit canonical docs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md docs/ACTIVE_PROJECT_HANDBOOK.md docs/NEXT_STEPS_AND_SANITY_CHECK.md
          git commit -m 'Close Build 188 canonical release authority'
          git push origin HEAD:build-188-release-closeout
