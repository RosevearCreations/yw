name: One-time Schema 176 branch prune

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  prune-schema176-branches:
    if: github.repository == 'RosevearCreations/yw'
    runs-on: ubuntu-latest
    steps:
      - name: Delete completed Schema 176 branches
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          branches=(
            "schema-176-authority-closeout"
            "schema-176-finance-posting-preflight"
          )
          for branch in "${branches[@]}"; do
            if [[ "$branch" == "main" ]]; then
              echo "Refusing to delete main"
              exit 1
            fi
            if gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/${branch}" >/dev/null 2>&1; then
              echo "Deleting ${branch}"
              gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${branch}"
            else
              echo "Already absent: ${branch}"
            fi
          done
          echo "Remaining branches:"
          gh api "repos/${GITHUB_REPOSITORY}/branches?per_page=100" --jq '.[].name'
