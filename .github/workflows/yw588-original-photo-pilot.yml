name: YW588 original private photo and dispatcher source acceptance
on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  yw588-evidence:
    name: YW588 original records, independent private custody and Shell redaction
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Prove fail-closed private photo acceptance and independent dispatcher roles
        run: node scripts/yw588-original-photo-pilot-check.mjs
  yw588-browser:
    name: YW588 authenticated original company and platform Shell browser acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9afbd3f7d6820020 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Install pinned Chromium
        run: npx playwright install chromium
      - name: Test owner and independent Shell guarded live readback
        run: npx playwright test --config=playwright.config.mjs tests/browser/yw588-original-photo-pilot.spec.mjs
