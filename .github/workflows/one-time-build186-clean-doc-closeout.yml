name: One-time clean Build 186 doc closeout

on:
  push:
    branches: [schema-186-release-authority-closeout-clean]
    paths:
      - '.github/workflows/one-time-build186-clean-doc-closeout.yml'

permissions:
  contents: write

jobs:
  closeout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: schema-186-release-authority-closeout-clean
      - name: Write final Build 186 canonical authority
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          readme=Path('README.md')
          handbook=Path('docs/ACTIVE_PROJECT_HANDBOOK.md')
          nextsteps=Path('docs/NEXT_STEPS_AND_SANITY_CHECK.md')

          final_block='''\n## Build 186 final release authority\n\n**Build 186 — Staging acceptance control plane + evidence runner modernization — COMPLETE.**\n\nFinal verified product authority:\n\n- live database **Schema 186 / 186 CURRENT**;\n- merged `main` product SHA **`046b9289acbe79c2a4feb4606a42dc50a8cad33d`**;\n- exact-main **Run #154 / `33710506232` — GREEN** across all static gates and six rendered browser suites;\n- canonical release-source evidence **row 19**;\n- `admin-staging-acceptance` **v1 ACTIVE / JWT enabled**;\n- Schema 186 staging-security assertions **7 / 7 PASS**;\n- application release authority **GREEN**; repository enforcement remains separately **AMBER** because `main` is unprotected;\n- Finance posting execution remains **OFF**; provider/payment mutation remains **OFF**; Production promotion remains **manual**;\n- Build 186 evidence and human signoff **never auto-close business staging rails**.\n\nCurrent scorecard truth after Build 186: **40 rails / 29 complete / 11 open**, all **11 / 11 classified**, **0 unclassified**, **0 proof drift**. Remaining open work is **6 staging acceptance**, **2 accounting acceptance**, **1 provider acceptance**, and **2 content approval** rails. Human pending remains **11** and external pending **1**; autonomous feature-followup pending is **0**.\n\nNo separate YardWeasels Supabase staging project is currently configured, so Build 186 did not fabricate live staging evidence or fall back to Production. The next build must be selected from a fresh readiness/architecture review rather than auto-completing any human/provider/accounting/content gate.\n'''

          def insert_final(s):
              if '## Build 186 final release authority' in s:
                  s=re.sub(r'\n## Build 186 final release authority\n.*?(?=\n## Historical release anchors retained for audit)', final_block, s, flags=re.S)
                  return s
              lines=s.splitlines(True)
              return ''.join(lines[:1])+final_block+''.join(lines[1:])

          common={
            'These historical anchors remain audit evidence only; current live authority is Build 185 / Schema 185 and Build 186 remains source-only until its release gates pass.':'These historical anchors remain audit evidence only; current live authority is Build 186 / Schema 186 with exact-main release proof recorded.',
            '**Current live authority:** Schema `185 / 185` — **Build 185 COMPLETE**':'**Current live authority:** Schema `186 / 186` — **Build 186 COMPLETE**',
            '**Current live schema authority:** `185 / 185` — **Build 185 COMPLETE**':'**Current live schema authority:** `186 / 186` — **Build 186 COMPLETE**',
            '**Final clean-main checkpoint:** `d126ddfb403d31faba1d9826df3e0ad1e0d58fd7`, exact-main Run #149 (`33705924533`) — GREEN':'**Build 186 product checkpoint:** `046b9289acbe79c2a4feb4606a42dc50a8cad33d`, exact-main Run #154 (`33710506232`) — GREEN',
            '**Final clean-main Build 185 checkpoint:** `d126ddfb403d31faba1d9826df3e0ad1e0d58fd7`, exact-main Run #149 (`33705924533`) — GREEN':'**Build 186 product checkpoint:** `046b9289acbe79c2a4feb4606a42dc50a8cad33d`, exact-main Run #154 (`33710506232`) — GREEN',
            '**Final Build 185 release evidence:** row `18`':'**Build 186 release evidence:** row `19`',
            '**Final clean release evidence:** row `18` in `it_release_source_evidence`':'**Build 186 release evidence:** row `19` in `it_release_source_evidence`',
            '**Release evidence:** row `18` in `it_release_source_evidence`':'**Build 186 release evidence:** row `19` in `it_release_source_evidence`',
            '**Build 186:** **ACTIVE in source only** on `schema-186-staging-acceptance-control-plane`; Schema 186 is not live until its source/browser gates are GREEN':'**Build 186:** **COMPLETE** on `main`; exact-main Run #154 and release evidence row 19 are GREEN',
            '**Build 186:** ACTIVE in source on `schema-186-staging-acceptance-control-plane`; live database remains Schema 185 until source/browser proof is green':'**Build 186:** **COMPLETE** on `main`; live database is Schema 186 / 186 CURRENT',
            '**Build 186:** ACTIVE on `schema-186-staging-acceptance-control-plane`; Schema 186 not live yet.':'**Build 186:** **COMPLETE** on `main`; Schema 186 / 186 is live and release-authority GREEN.',
            '- Schema 186 / Build 186 — **ACTIVE SOURCE WORK**: staging acceptance control plane and evidence runner modernization.':'- Schema 186 / Build 186 — **COMPLETE**: staging acceptance control plane, service-private evidence hardening, exact source/schema binding, explicit human signoff, and Admin I.T. acceptance evidence.',
            '- **Build 186 — Staging acceptance control plane + evidence runner modernization — ACTIVE**':'- **Build 186 — Staging acceptance control plane + evidence runner modernization — COMPLETE**',
          }

          # README
          s=insert_final(readme.read_text())
          for a,b in common.items(): s=s.replace(a,b)
          s=s.replace('## Build 186 — active bounded work','## Build 186 delivered boundary')
          s=s.replace('**Build 186 — Staging acceptance control plane + evidence runner modernization** is the current source build.','**Build 186 — Staging acceptance control plane + evidence runner modernization** is complete on `main`.')
          s=s.replace('Build 186 must provide:','Build 186 delivered:')
          s=s.replace('The first live acceptance suite is intentionally bounded to `operations_cockpit_live`. It will require a **dedicated non-production Supabase project**, a staging admin identity/JWT, a lower-rank worker JWT, and manual GitHub workflow dispatch. Until that separate staging target exists, live staging execution remains closed rather than falling back to Production.','The first live acceptance suite remains intentionally bounded to `operations_cockpit_live`. Real execution still requires a **dedicated non-production Supabase project**, a staging admin identity/JWT, a lower-rank worker JWT, and manual GitHub workflow dispatch. That separate staging target does not currently exist, so business staging acceptance remains open rather than falling back to Production.')
          s=s.replace('Numbered migrations are permanent audit history through Schema 185; Schema 186 is currently proposed on its feature branch.','Numbered migrations are permanent audit history through Schema 186; Schema 186 is live and release-authority GREEN.')
          s=s.replace('The final Build 185 clean-main SHA/run is recorded in database release evidence row 18.','Build 186 product release proof is recorded in database release evidence row 19; the final documentation-closeout SHA/run is recorded separately after this closeout merges.')
          readme.write_text(s)

          # Handbook
          s=insert_final(handbook.read_text())
          for a,b in common.items(): s=s.replace(a,b)
          s=s.replace('## Scorecard truth after Build 185','## Scorecard truth after Build 186')
          s=s.replace('- **39** total rails;\n- **28 complete / 11 open**;','- **40** total rails;\n- **29 complete / 11 open**;')
          s=s.replace('## Build 186 authority and scope','## Build 186 delivered authority and scope')
          s=s.replace('Build 186 exists because the roadmap has reached a different phase:', 'Build 186 was selected because the roadmap had reached a different phase:')
          s=s.replace('Schema 186 reuses the existing staging authorities rather than creating parallel tables:', 'Schema 186 reused the existing staging authorities rather than creating parallel tables:')
          s=s.replace('The final Build 185 clean-main SHA/run is recorded in `it_release_source_evidence` after branch cleanup and final CI.', 'Build 186 product release evidence is row 19; a final documentation-closeout exact-main evidence row is recorded after this closeout merges and passes CI.')
          handbook.write_text(s)

          # Next steps
          s=insert_final(nextsteps.read_text())
          for a,b in common.items(): s=s.replace(a,b)
          current='''## Current checkpoint\n\nBuild 186 — **staging acceptance control plane + evidence runner modernization** — is completely closed in source, database, runtime, rendered acceptance, and release authority.\n\nVerified closure:\n\n- live database `186 / 186`, current;\n- merged product `main` SHA `046b9289acbe79c2a4feb4606a42dc50a8cad33d`;\n- exact-main Run #154 / `33710506232` GREEN;\n- release evidence row 19;\n- Schema 186 staging-security assertions `7 / 7` PASS;\n- `admin-staging-acceptance` v1 ACTIVE / JWT enabled;\n- Build 186 rail complete 100% / 10 of 10;\n- scorecard truth GREEN: 40 rails, 29 complete, 11 open, 11 classified, 0 unclassified, 0 proof drift;\n- six business staging-acceptance rails remain open and human-gated;\n- Finance execution OFF, provider/payment mutation OFF, Production promotion manual.\n\nNo dedicated YW Supabase staging project is configured, so real business staging acceptance has not been fabricated.\n\n'''
          s=re.sub(r'## Current checkpoint\n.*?(?=## Build sequence)',current,s,flags=re.S)
          score='''## Scorecard after Build 186\n\nLive scorecard truth is GREEN:\n\n- 40 total rails;\n- 29 complete / 11 open;\n- 11 / 11 open rails classified;\n- unclassified open 0;\n- proof-closure drift 0;\n- staging acceptance pending 6;\n- accounting acceptance pending 2;\n- provider acceptance pending 1;\n- content approval pending 2;\n- feature follow-up pending 0;\n- human pending 11;\n- external pending 1.\n\nThere is no honest autonomous feature-followup rail. Remaining business work requires actual evidence or approval; Build 187 must therefore come from a fresh technical/readiness review rather than auto-closing those rails.\n\n'''
          s=re.sub(r'## Scorecard after Build 185\n.*?(?=## Build 186 — bounded objective)',score,s,flags=re.S)
          s=s.replace('## Build 186 — bounded objective','## Build 186 — delivered boundary')
          s=s.replace('Build 186 upgrades the existing staging evidence machinery so the remaining staging acceptance work can be performed safely and repeatedly.','Build 186 upgraded the existing staging evidence machinery so remaining staging acceptance work can be performed safely and repeatedly.')
          s=s.replace('### Build 186 required controls','### Build 186 delivered controls')
          s=s.replace('## First Build 186 live suite','## Build 186 live-staging boundary')
          s=s.replace('The initial live runner is intentionally restricted to `operations_cockpit_live`.','The live runner is intentionally restricted to `operations_cockpit_live`; it has not been executed against Production and cannot do so by fallback.')
          nextsteps.write_text(s)

          # Hard fail if canonical top-level authority still says Build 186 is active/source-only/not-live.
          for p in (readme,handbook,nextsteps):
              text=p.read_text()
              bad=['Build 186 — ACTIVE','Build 186:** ACTIVE','Schema 186 not live yet','Schema 186 is currently proposed','Build 186 remains source-only']
              leftovers=[x for x in bad if x in text]
              if leftovers: raise SystemExit(f'{p}: stale Build 186 authority markers remain: {leftovers}')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md docs/ACTIVE_PROJECT_HANDBOOK.md docs/NEXT_STEPS_AND_SANITY_CHECK.md
          git commit -m 'Close Build 186 canonical release authority docs'
          git push origin HEAD:schema-186-release-authority-closeout-clean
