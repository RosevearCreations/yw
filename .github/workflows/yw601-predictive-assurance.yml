name: YW601 signed predictive evidence and actual handler acceptance
on:
  pull_request:
    branches: [dev, main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  predictive-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: node scripts/yw601-predictive-assurance-check.mjs
      - run: node scripts/yw601-edge-handler-check.mjs
      - run: node --check js/yw601-predictive-assurance.js
      - run: node --check supabase/functions/_shared/yw601-original-contracts.mjs
