name: One-time Schema 185 branch prune

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-schema185-branch-prune.yml'

permissions:
  contents: write

jobs:
  prune:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Delete completed Build 185 branches
        run: git push origin --delete schema-185-equipment-scan-custody schema-185-release-authority-closeout
