name: One-time Build 188 source wiring

on:
  push:
    branches: [schema-188-open-rail-acceptance-readiness]
    paths:
      - '.github/workflows/one-time-build188-source-wiring.yml'

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: schema-188-open-rail-acceptance-readiness
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Wire Build 188 source
        run: python scripts/.tmp_build188_wire.py
      - name: Verify Build 188 source gate
        run: npm run test:open-rail-readiness
      - name: Commit wired source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add supabase/functions/admin-it-control/index.ts js/it-readiness-ui.js tests/browser/it-scorecard-truth.spec.mjs package.json .github/workflows/staging-browser-integration.yml
          git commit -m 'Wire Build 188 acceptance readiness into Admin I.T. and CI'
          git push origin HEAD:schema-188-open-rail-acceptance-readiness
# rerun after JSON guard convergence
