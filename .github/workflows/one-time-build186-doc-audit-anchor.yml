name: One-time Build 186 doc audit anchors

on:
  push:
    branches: [schema-186-staging-acceptance-control-plane]
    paths:
      - '.github/workflows/one-time-build186-doc-audit-anchor.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: schema-186-staging-acceptance-control-plane
      - name: Restore historical release anchors
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          files=[Path('README.md'),Path('docs/ACTIVE_PROJECT_HANDBOOK.md'),Path('docs/NEXT_STEPS_AND_SANITY_CHECK.md')]
          block='''\n## Historical release anchors retained for audit\n\n- **Build 184 / Schema 184 — COMPLETE product proof:** `main` `613118f52fcbad147a56226ccdeabf3a64a1c8b0`, exact-main Run #136 (`33698631685`) — SUCCESS.\n- **Build 183 / Schema 183 — COMPLETE prior clean authority:** `main` `2f4e4fa25299dd285718c2bb78cc40fc05c55ebf`, exact-main Run #132 (`33697274220`) — GREEN.\n\nThese historical anchors remain audit evidence only; current live authority is Build 185 / Schema 185 and Build 186 remains source-only until its release gates pass.\n'''
          for p in files:
              s=p.read_text()
              if '613118f52fcbad147a56226ccdeabf3a64a1c8b0' in s and '2f4e4fa25299dd285718c2bb78cc40fc05c55ebf' in s:
                  continue
              lines=s.splitlines(True)
              if not lines or not lines[0].startswith('# '):
                  raise SystemExit(f'Unexpected canonical doc heading in {p}')
              s=lines[0]+block+''.join(lines[1:])
              p.write_text(s)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md docs/ACTIVE_PROJECT_HANDBOOK.md docs/NEXT_STEPS_AND_SANITY_CHECK.md
          git commit -m 'Restore Build 183 and 184 audit anchors'
          git push origin HEAD:schema-186-staging-acceptance-control-plane
