name: YW590 original live field witness and redacted Shell financial isolation contract
on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  field-source-security:
    name: YW590 real Edge original crew-reviewer-Sysop challenge and invoice isolation
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Actual Edge request handler against isolated independent Auth and Storage binary bytes
        run: |
          node scripts/yw589-original-device-security-check.mjs
          node scripts/yw590-live-original-witness-check.mjs
  field-browser-security:
    name: YW590 mobile crew/reviewer case and independent Shell original-device browser
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install chromium
      - name: Verify original-device human claim and zero-finance Shell closure UX
        run: npx playwright test --config=playwright.config.mjs tests/browser/yw590-original-field-certification.spec.mjs
