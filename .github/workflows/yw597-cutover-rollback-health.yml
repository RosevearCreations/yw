name: YW597 signed owner cutover, independent rollback readiness, scheduled ACK evidence watch
on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cutover-rollback-signed-master-health:
    name: Genuine original Master old/next ACK + no false cutover + cron watchdog
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: YW596 original Master receiver and cross-tenant constraints
        run: node scripts/yw596-receiver-rotation-continuity-check.mjs
      - name: YW597 original cutover/rollback and Master ACK watch
        run: node scripts/yw597-cutover-rollback-health-check.mjs
