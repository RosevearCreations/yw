name: YW584 owner-site and Sysop-support security & staged photo custody
on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  yw584-tenant-security:
    name: YW584 tenant site, support and independent staging pilot security
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - run: node scripts/yw584-company-support-check.mjs
      - run: node scripts/yw584-staging-pilot-check.mjs
