name: One-time Schema 181 branch prune

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/one-time-schema181-branch-prune.yml

permissions:
  contents: write

jobs:
  prune:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Prune completed Schema 181 branches
        run: |
          git push origin --delete schema-181-finance-mapping-observability || true
          git push origin --delete schema-181-it-observability-status-fix || true

      - name: Remove this one-time workflow
        run: |
          rm .github/workflows/one-time-schema181-branch-prune.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/one-time-schema181-branch-prune.yml
          git commit -m "Remove completed Schema 181 branch prune workflow"
          git push origin HEAD:main