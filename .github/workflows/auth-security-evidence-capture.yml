name: YWI Auth security evidence capture

on:
  pull_request:
  workflow_dispatch:
    inputs:
      confirm_read_only_capture:
        description: 'Run one read-only Supabase Auth config capture and prepare encrypted evidence candidates'
        required: true
        default: 'false'
        type: choice
        options: ['false','true']

permissions:
  contents: read

concurrency:
  group: ywi-auth-security-evidence-capture
  cancel-in-progress: false

jobs:
  contract-check:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify Auth evidence capture workflow contract
        run: node scripts/auth-security-evidence-capture-workflow-check.mjs

  capture-auth-evidence:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.confirm_read_only_capture == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_AUTH_CONFIG_READ_TOKEN }}
      YWI_AUTH_EVIDENCE_ARTIFACT_PASSPHRASE: ${{ secrets.YWI_AUTH_EVIDENCE_ARTIFACT_PASSPHRASE }}
      YWI_AUTH_EVIDENCE_PREP_OUTPUT_DIR: auth-security-evidence-prepared
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Validate dedicated read-only capture secrets
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            echo 'SUPABASE_AUTH_CONFIG_READ_TOKEN is required.' >&2
            exit 1
          fi
          if [ "${#YWI_AUTH_EVIDENCE_ARTIFACT_PASSPHRASE}" -lt 24 ]; then
            echo 'YWI_AUTH_EVIDENCE_ARTIFACT_PASSPHRASE must be at least 24 characters.' >&2
            exit 1
          fi
      - name: Capture and prepare sanitized Auth evidence
        shell: bash
        run: npm run auth:evidence:capture-prepare >/dev/null
      - name: Validate sanitized preparation output
        shell: bash
        run: |
          set -euo pipefail
          test -f "$YWI_AUTH_EVIDENCE_PREP_OUTPUT_DIR/capture.json"
          test -f "$YWI_AUTH_EVIDENCE_PREP_OUTPUT_DIR/candidate-set.json"
          test -f "$YWI_AUTH_EVIDENCE_PREP_OUTPUT_DIR/leaked-password-protection.json"
          test -f "$YWI_AUTH_EVIDENCE_PREP_OUTPUT_DIR/mfa-options.json"
          if grep -R -F -- "$SUPABASE_ACCESS_TOKEN" "$YWI_AUTH_EVIDENCE_PREP_OUTPUT_DIR" >/dev/null; then
            echo 'Management API token unexpectedly appeared in prepared evidence.' >&2
            exit 1
          fi
      - name: Encrypt prepared evidence before artifact upload
        shell: bash
        run: |
          set -euo pipefail
          tar -czf auth-security-evidence-prepared.tgz -C "$YWI_AUTH_EVIDENCE_PREP_OUTPUT_DIR" .
          openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt \
            -in auth-security-evidence-prepared.tgz \
            -out auth-security-evidence-prepared.tgz.enc \
            -pass env:YWI_AUTH_EVIDENCE_ARTIFACT_PASSPHRASE
          rm -f auth-security-evidence-prepared.tgz
          rm -rf "$YWI_AUTH_EVIDENCE_PREP_OUTPUT_DIR"
      - name: Upload encrypted Auth evidence package
        uses: actions/upload-artifact@v4
        with:
          name: ywi-auth-security-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: auth-security-evidence-prepared.tgz.enc
          if-no-files-found: error
          retention-days: 30
