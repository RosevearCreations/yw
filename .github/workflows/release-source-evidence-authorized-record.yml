name: YWI authorized release-source evidence recording

on:
  pull_request:
    paths:
      - '.github/workflows/release-source-evidence-authorized-record.yml'
      - 'scripts/release-source-evidence-record-workflow-check.mjs'
      - 'scripts/release-source-evidence-verify.mjs'
      - 'scripts/release-source-evidence-record.mjs'
  workflow_dispatch:
    inputs:
      source_run_id:
        description: 'Successful exact-main YWI source and staging checks workflow run ID'
        required: true
        type: string
      source_run_attempt:
        description: 'Exact workflow run attempt that produced the release-source candidate'
        required: true
        default: '1'
        type: string
      confirm_record:
        description: 'Explicitly authorize verified release-source evidence recording only'
        required: true
        default: 'false'
        type: choice
        options:
          - 'false'
          - I_CONFIRM_RELEASE_EVIDENCE_RECORD

permissions:
  contents: read
  actions: read

concurrency:
  group: ywi-authorized-release-source-evidence-recording
  cancel-in-progress: false

jobs:
  contract-check:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Verify authorized release evidence workflow contract
        run: node scripts/release-source-evidence-record-workflow-check.mjs

  record-release-source-evidence:
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.confirm_record == 'I_CONFIRM_RELEASE_EVIDENCE_RECORD' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      SUPABASE_URL: https://jmqvkgiqlimdhcofwkxr.supabase.co
      YWI_PRODUCTION_PROJECT_REF: jmqvkgiqlimdhcofwkxr
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      YWI_RELEASE_EVIDENCE_RECORD_CONFIRM: I_CONFIRM_RELEASE_EVIDENCE_RECORD
      YWI_RELEASE_CANDIDATE_PATH: release-source-evidence.json
      YWI_RELEASE_WORKFLOW_RUN_PATH: release-workflow-run.json
      YWI_RELEASE_MAIN_BRANCH_PATH: release-main-branch.json
      YWI_RELEASE_VERIFIED_PATH: release-source-evidence-verified.json
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Validate manual evidence recording inputs
        shell: bash
        env:
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          SOURCE_RUN_ATTEMPT: ${{ inputs.source_run_attempt }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_RUN_ID" =~ ^[1-9][0-9]*$ ]] || { echo 'source_run_id must be a positive integer.' >&2; exit 1; }
          [[ "$SOURCE_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]] || { echo 'source_run_attempt must be a positive integer.' >&2; exit 1; }
          test -n "${SUPABASE_SERVICE_ROLE_KEY:-}" || { echo 'SUPABASE_SERVICE_ROLE_KEY is required.' >&2; exit 1; }
      - name: Download exact release-source candidate artifact
        uses: actions/download-artifact@v4
        with:
          name: ywi-main-release-source-${{ inputs.source_run_id }}-${{ inputs.source_run_attempt }}
          path: release-source-evidence-download
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.source_run_id }}
      - name: Re-read completed run and current protected main
        shell: bash
        env:
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
        run: |
          set -euo pipefail
          candidate='release-source-evidence-download/release-source-evidence.json'
          test -f "$candidate"
          cp "$candidate" "$YWI_RELEASE_CANDIDATE_PATH"
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}" > "$YWI_RELEASE_WORKFLOW_RUN_PATH"
          gh api "repos/${GITHUB_REPOSITORY}/branches/main" > "$YWI_RELEASE_MAIN_BRANCH_PATH"
      - name: Final verify exact-main release-source evidence
        run: node scripts/release-source-evidence-verify.mjs
      - name: Record verified release-source evidence
        run: node scripts/release-source-evidence-record.mjs "$YWI_RELEASE_VERIFIED_PATH"
      - name: Destroy release evidence workspace
        if: ${{ always() }}
        shell: bash
        run: |
          rm -rf release-source-evidence-download
          rm -f release-source-evidence.json release-workflow-run.json release-main-branch.json release-source-evidence-verified.json
