name: YWI authorized release-source evidence recording

on:
  pull_request:
    paths:
      - '.github/workflows/release-source-evidence-authorized-record.yml'
      - 'scripts/release-source-evidence-record-workflow-check.mjs'
      - 'scripts/release-source-evidence-verify.mjs'
      - 'scripts/release-source-evidence-record.mjs'
      - 'supabase/functions/release-source-evidence-record/**'
      - 'supabase/config.toml'
  workflow_run:
    workflows:
      - YWI source and staging checks
    types:
      - completed
  workflow_dispatch:
    inputs:
      source_run_id:
        description: 'Successful exact-main YWI source and staging checks workflow run ID'
        required: true
        type: string
      source_run_attempt:
        description: 'Exact workflow run attempt that produced the release-source candidate'
        required: true
        default: '1'
        type: string
      confirm_record:
        description: 'Explicitly authorize verified release-source evidence recording only'
        required: true
        default: 'false'
        type: choice
        options:
          - 'false'
          - I_CONFIRM_RELEASE_EVIDENCE_RECORD

permissions:
  contents: read
  actions: read
  id-token: write

concurrency:
  group: ywi-authorized-release-source-evidence-recording
  cancel-in-progress: false

jobs:
  contract-check:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Verify authorized release evidence workflow contract
        run: node scripts/release-source-evidence-record-workflow-check.mjs

  record-release-source-evidence:
    if: ${{ (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.confirm_record == 'I_CONFIRM_RELEASE_EVIDENCE_RECORD') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      YWI_RELEASE_RECORDER_URL: https://jmqvkgiqlimdhcofwkxr.supabase.co/functions/v1/release-source-evidence-record
      YWI_RELEASE_OIDC_AUDIENCE: ywi-release-evidence
      YWI_RELEASE_CANDIDATE_PATH: release-source-evidence.json
      YWI_RELEASE_WORKFLOW_RUN_PATH: release-workflow-run.json
      YWI_RELEASE_MAIN_BRANCH_PATH: release-main-branch.json
      YWI_RELEASE_VERIFIED_PATH: release-source-evidence-verified.json
      SOURCE_RUN_ID: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.id || inputs.source_run_id }}
      SOURCE_RUN_ATTEMPT: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.run_attempt || inputs.source_run_attempt }}
      SOURCE_HEAD_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.SOURCE_HEAD_SHA }}
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Validate authorized evidence recording context
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SOURCE_RUN_ID" =~ ^[1-9][0-9]*$ ]] || { echo 'source_run_id must be a positive integer.' >&2; exit 1; }
          [[ "$SOURCE_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]] || { echo 'source_run_attempt must be a positive integer.' >&2; exit 1; }
          [[ "$SOURCE_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo 'source_head_sha must be a full lowercase commit SHA.' >&2; exit 1; }
          [[ "$YWI_RELEASE_RECORDER_URL" == 'https://jmqvkgiqlimdhcofwkxr.supabase.co/functions/v1/release-source-evidence-record' ]] || { echo 'release recorder URL must remain pinned to YardWeasels Production.' >&2; exit 1; }
          [[ "$YWI_RELEASE_OIDC_AUDIENCE" == 'ywi-release-evidence' ]] || { echo 'release recorder OIDC audience is invalid.' >&2; exit 1; }
      - name: Download exact release-source candidate artifact
        uses: actions/download-artifact@v4
        with:
          name: ywi-main-release-source-${{ env.SOURCE_RUN_ID }}-${{ env.SOURCE_RUN_ATTEMPT }}
          path: release-source-evidence-download
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ env.SOURCE_RUN_ID }}
      - name: Re-read completed run and current protected main
        shell: bash
        run: |
          set -euo pipefail
          candidate='release-source-evidence-download/release-source-evidence.json'
          test -f "$candidate"
          cp "$candidate" "$YWI_RELEASE_CANDIDATE_PATH"
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}" > "$YWI_RELEASE_WORKFLOW_RUN_PATH"
          gh api "repos/${GITHUB_REPOSITORY}/branches/main" > "$YWI_RELEASE_MAIN_BRANCH_PATH"
      - name: Final verify exact-main release-source evidence
        run: node scripts/release-source-evidence-verify.mjs
      - name: Record verified release-source evidence metadata with GitHub OIDC
        shell: bash
        run: |
          set -euo pipefail
          oidc_response="$(curl --fail-with-body --silent --show-error \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${YWI_RELEASE_OIDC_AUDIENCE}")"
          oidc_token="$(jq -r '.value // empty' <<<"$oidc_response")"
          test -n "$oidc_token" || { echo 'GitHub OIDC token request returned no token.' >&2; exit 1; }
          jq -n \
            --slurpfile verified "$YWI_RELEASE_VERIFIED_PATH" \
            --argjson source_run_id "$SOURCE_RUN_ID" \
            --argjson source_run_attempt "$SOURCE_RUN_ATTEMPT" \
            '{verified:$verified[0],source_run_id:$source_run_id,source_run_attempt:$source_run_attempt}' \
            > release-record-request.json
          curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer ${oidc_token}" \
            -H 'Content-Type: application/json' \
            --data-binary @release-record-request.json \
            "$YWI_RELEASE_RECORDER_URL" \
            > release-record-response.json
          jq -e --arg sha "$SOURCE_HEAD_SHA" --argjson run_id "$SOURCE_RUN_ID" \
            '.ok == true and .source_sha == $sha and .workflow_run_id == $run_id and .source_gate_status == "green" and .repository_enforcement_status == "amber" and .branch_protection_reported == true and .branch_policy_verified == false' \
            release-record-response.json >/dev/null
          echo 'OIDC-authenticated release evidence recording: RECORDED; source gate GREEN; detailed repository policy remains AMBER.'
      - name: Destroy release evidence workspace
        if: ${{ always() }}
        shell: bash
        run: |
          rm -rf release-source-evidence-download
          rm -f release-source-evidence.json release-workflow-run.json release-main-branch.json release-source-evidence-verified.json release-record-request.json release-record-response.json
