name: Schema 162 shell activation

on:
  push:
    branches: [schema-162-permission-driven-module-runtime]

permissions:
  contents: write

jobs:
  activate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: schema-162-permission-driven-module-runtime
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/schema162-activate-runtime.mjs
      - name: Commit shell activation when needed
        run: |
          if git diff --quiet -- index.html; then
            echo "Shell already activated."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Schema 162 activate permission driven module shell"
          git push origin HEAD:schema-162-permission-driven-module-runtime
