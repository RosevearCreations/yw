      - name: Install Chromium for rendered module acceptance
        shell: bash
        run: |
          set -euo pipefail
          # GitHub's Ubuntu runner already provides Chromium's system libraries.
          # Playwright --with-deps spawns apt-get, which can outlive a bounded
          # timeout and lock dpkg across retries, leaving all browser gates skipped.
          # Install only the pinned Playwright browser; never start an APT writer.
          install_ok=false
          for attempt in 1 2 3; do
            echo "Chromium install attempt ${attempt}/3"
            if timeout --kill-after=10s 150s npx playwright install chromium; then
              install_ok=true
              break
            fi
            if [ "${attempt}" -lt 3 ]; then
              echo "Chromium install attempt ${attempt} did not complete; retrying after a short cooldown."
              sleep 10
            fi
          done
          if [ "${install_ok}" != "true" ]; then
            echo "Chromium install did not complete after 3 bounded attempts."
            exit 1
          fi
