name: YWI source and staging checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_staging:
        description: 'Run staging-only integration proof'
        required: false
        default: 'false'
        type: choice
        options: ['false','true']
      target_rail:
        description: 'Schema 187 staging acceptance rail'
        required: false
        default: 'operations_cockpit_live'
        type: choice
        options:
          - operations_cockpit_live
          - quote_intake_live
          - live_job_updates
          - customer_live_update_notifications
          - service_execution_proof_costing
          - supervisor_closeout_signoff_invoice_followup
      create_fixtures:
        description: 'Create and clean disposable STAGING fixtures during the runner phase'
        required: false
        default: 'false'
        type: choice
        options: ['false','true']

jobs:
  source-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run test:modules
      - run: npm run test:it
      - run: npm run test:it-scorecard-truth
      - run: npm run test:open-rail-readiness
      - run: npm run test:submission-security
      - run: npm run test:security-advisor-truth
      - run: npm run test:admin-account-security
      - run: npm run test:equipment-scan
      - run: npm run test:staging-acceptance
      - run: npm run test:staging-scenarios
      - run: npm run test:runtime
      - run: npm run test:boundaries
      - run: npm run test:acceptance
      - run: npm run test:release-authority
      - run: npm run test:event-wiring
      - run: npm run test:job-completion-event
      - run: npm run test:finance-completion-consumer
      - run: npm run test:consumer-observability
      - run: npm run test:finance-consumer-execution
      - run: npm run test:finance-completion-review
      - run: npm run test:finance-schema-dependencies
      - run: npm run test:finance-posting-safety
      - run: npm run test:finance-posting-preflight
      - run: npm run test:finance-posting-execution-recovery
      - run: npm run test:finance-operational-control-plane
      - run: npm run test:finance-release-hardening
      - run: npm run test:finance-account-mapping-review
      - run: npm run test:finance-account-mapping-observability
      - run: npm run test:finance-account-mapping-decision-support
      - run: npm run test:repo
      - run: npm run test:contrast
      - run: npm run test:navigation
      - name: Install Chromium for rendered module acceptance
        run: npx playwright install --with-deps chromium
      - run: npm run test:browser:modules
      - run: npm run test:browser:finance
      - run: npm run test:browser:finance-mapping
      - run: npm run test:browser:it
      - run: npm run test:browser:equipment-scan
      - run: npm run test:browser:staging-acceptance
      - run: npm run test:browser:admin-account-security

  staging-proof:
    if: github.event_name == 'workflow_dispatch' && inputs.run_staging == 'true'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Refuse missing staging boundary
        run: |
          test "${YWI_RUN_STAGING_RPC_TESTS}" = "1"
          test -n "${SUPABASE_URL}"
          test -n "${SUPABASE_SERVICE_ROLE_KEY}"
          test -n "${YWI_STAGING_PROJECT_REF}"
          test -n "${YWI_STAGING_JOB_ADMIN_PROFILE_ID}"
          test "${YWI_STAGING_PROJECT_REF}" != "${YWI_PRODUCTION_PROJECT_REF}"
        env:
          YWI_RUN_STAGING_RPC_TESTS: ${{ secrets.YWI_RUN_STAGING_RPC_TESTS }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          YWI_STAGING_PROJECT_REF: ${{ secrets.YWI_STAGING_PROJECT_REF }}
          YWI_STAGING_JOB_ADMIN_PROFILE_ID: ${{ secrets.YWI_STAGING_JOB_ADMIN_PROFILE_ID }}
          YWI_PRODUCTION_PROJECT_REF: jmqvkgiqlimdhcofwkxr
      - name: Run Schema 187 staging catalog evidence
        run: npm run test:staging
        env:
          YWI_RUN_STAGING_RPC_TESTS: ${{ secrets.YWI_RUN_STAGING_RPC_TESTS }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          YWI_STAGING_PROJECT_REF: ${{ secrets.YWI_STAGING_PROJECT_REF }}
          YWI_PRODUCTION_PROJECT_REF: jmqvkgiqlimdhcofwkxr
          YWI_STAGING_LABEL: staging
          YWI_STAGING_CONFIRM: I_CONFIRM_STAGING_ONLY
          YWI_STAGING_JOB_ADMIN_PROFILE_ID: ${{ secrets.YWI_STAGING_JOB_ADMIN_PROFILE_ID }}
          YWI_STAGING_JOB_ADMIN_JWT: ${{ secrets.YWI_STAGING_JOB_ADMIN_JWT }}
          YWI_STAGING_WORKER_JWT: ${{ secrets.YWI_STAGING_WORKER_JWT }}
          YWI_STAGING_SOURCE_SHA: ${{ github.sha }}
          YWI_STAGING_WORKFLOW_RUN_ID: ${{ github.run_id }}
          YWI_STAGING_TARGET_RAIL: ${{ inputs.target_rail }}
          YWI_STAGING_CREATE_FIXTURES: ${{ inputs.create_fixtures == 'true' && '1' || '0' }}
          YWI_STAGING_FIXTURE_LABEL: STAGING-B187-RUN
