name: YWI source and staging checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_staging:
        description: 'Run staging-only integration proof'
        required: false
        default: 'false'
        type: choice
        options: ['false','true']
      target_rail:
        description: 'Schema 187 staging acceptance rail'
        required: false
        default: 'operations_cockpit_live'
        type: choice
        options:
          - operations_cockpit_live
          - quote_intake_live
          - live_job_updates
          - customer_live_update_notifications
          - service_execution_proof_costing
          - supervisor_closeout_signoff_invoice_followup
      create_fixtures:
        description: 'Create and clean disposable STAGING fixtures during the runner phase'
        required: false
        default: 'false'
        type: choice
        options: ['false','true']

permissions:
  contents: write

jobs:
  source-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run test:modules
      - run: npm run test:it
      - run: npm run test:it-scorecard-truth
      - run: npm run test:open-rail-readiness
      - run: npm run test:submission-security
      - run: npm run test:security-advisor-truth
      - run: npm run test:equipment-scan
      - run: npm run test:staging-acceptance
      - run: npm run test:staging-scenarios
      - run: npm run test:runtime
      - run: npm run test:boundaries
      - run: npm run test:acceptance
      - run: npm run test:release-authority
      - run: npm run test:event-wiring
      - run: npm run test:job-completion-event
      - run: npm run test:finance-completion-consumer
      - run: npm run test:consumer-observability
      - run: npm run test:finance-consumer-execution
      - run: npm run test:finance-completion-review
      - run: npm run test:finance-schema-dependencies
      - run: npm run test:finance-posting-safety
      - run: npm run test:finance-posting-preflight
      - run: npm run test:finance-posting-execution-recovery
      - run: npm run test:finance-operational-control-plane
      - run: npm run test:finance-release-hardening
      - run: npm run test:finance-account-mapping-review
      - run: npm run test:finance-account-mapping-observability
      - run: npm run test:finance-account-mapping-decision-support
      - run: npm run test:repo
      - run: npm run test:contrast
      - run: npm run test:navigation
      - name: Install Chromium for rendered module acceptance
        run: npx playwright install --with-deps chromium
      - run: npm run test:browser:modules
      - run: npm run test:browser:finance
      - run: npm run test:browser:finance-mapping
      - run: npm run test:browser:it
      - run: npm run test:browser:equipment-scan
      - run: npm run test:browser:staging-acceptance

  build190-authority-doc-closeout:
    if: github.event_name == 'pull_request' && github.head_ref == 'build-190-authority-doc-closeout'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - name: Converge Build 190 authority docs and self-clean
        run: |
          python - <<'PY'
          from pathlib import Path

          block = r'''## Build 190 final release authority

**Build 190 — Security advisor truth reconciliation — COMPLETE.**

Final verified product authority:

- live database **Schema 190 / 190 CURRENT**;
- merged product `main` SHA **`3159dbf447583ab0a19d21a4196a3237efb4c144`**;
- exact-main **Run #178 / `33774434247` — GREEN** across every source/static/release/Finance gate and all six rendered browser suites;
- canonical release-source evidence **row 24**;
- live security-advisor truth assertions **7 / 7 PASS**;
- captured advisor snapshot **75 claims / 70 stale objects / 2 verified safe / 1 catalog-confirmed follow-up / 2 external-verification items / 0 unclassified**;
- advisor reconciliation status **GREEN** while remaining security follow-up status is correctly **AMBER**;
- `public.set_updated_at()` now has fixed `search_path=public,pg_temp`;
- the Supabase advisor endpoint has not yet converged and continues to report stale/deleted objects, so live PostgreSQL catalog truth remains authoritative;
- the only catalog-confirmed extension follow-up is `pg_net` installed in `public`; relocation is **not** authorized until dependency/usage reconnaissance proves it safe;
- leaked-password protection and MFA remain separately evidence-gated Supabase Auth configuration follow-ups;
- Build 190 technical rail **COMPLETE 100% / 10 of 10** with immutable exact-main completion evidence;
- post-closeout scorecard truth **44 rails / 33 complete / 11 open**; the same 11 human/provider/accounting/content acceptance rails remain open;
- application release authority **GREEN**; repository enforcement remains separately **AMBER** because `main` is unprotected;
- Finance posting execution remains **OFF**; provider/payment mutation remains **OFF**; Production promotion remains **manual**.

Build 190 deliberately does **not** treat an advisor warning as proof of a live defect. Findings are classified as `stale_object`, `verified_safe`, `confirmed_followup`, or `external_verification` against live catalog/configuration authority before remediation. No Build 190 path rewrites business rows or auto-closes human acceptance work.

**Next bounded technical candidate — Build 191:** inventory every live `pg_net` dependency and usage path, prove extension-schema relocation safety, and only then decide whether relocation should be applied. Supabase Auth password/MFA configuration remains a separate external-control path and must not be guessed from PostgreSQL catalogs.
'''

          for path in map(Path, ['README.md','docs/ACTIVE_PROJECT_HANDBOOK.md','docs/NEXT_STEPS_AND_SANITY_CHECK.md']):
              text = path.read_text(encoding='utf-8')
              if '## Build 190 final release authority' not in text:
                  first_nl = text.find('\n')
                  if first_nl < 0:
                      raise SystemExit(f'No heading line found in {path}')
                  path.write_text(text[:first_nl+1] + '\n' + block + '\n' + text[first_nl+1:], encoding='utf-8')
          PY
          git fetch origin main
          git checkout origin/main -- .github/workflows/staging-browser-integration.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md docs/ACTIVE_PROJECT_HANDBOOK.md docs/NEXT_STEPS_AND_SANITY_CHECK.md .github/workflows/staging-browser-integration.yml
          git commit -m "Build 190: converge canonical release authority"
          git push origin HEAD:${{ github.head_ref }}

  staging-proof:
    if: github.event_name == 'workflow_dispatch' && inputs.run_staging == 'true'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Refuse missing staging boundary
        run: |
          test "${YWI_RUN_STAGING_RPC_TESTS}" = "1"
          test -n "${SUPABASE_URL}"
          test -n "${SUPABASE_SERVICE_ROLE_KEY}"
          test -n "${YWI_STAGING_PROJECT_REF}"
          test -n "${YWI_STAGING_JOB_ADMIN_PROFILE_ID}"
          test "${YWI_STAGING_PROJECT_REF}" != "${YWI_PRODUCTION_PROJECT_REF}"
        env:
          YWI_RUN_STAGING_RPC_TESTS: ${{ secrets.YWI_RUN_STAGING_RPC_TESTS }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          YWI_STAGING_PROJECT_REF: ${{ secrets.YWI_STAGING_PROJECT_REF }}
          YWI_STAGING_JOB_ADMIN_PROFILE_ID: ${{ secrets.YWI_STAGING_JOB_ADMIN_PROFILE_ID }}
          YWI_PRODUCTION_PROJECT_REF: jmqvkgiqlimdhcofwkxr
      - name: Run Schema 187 staging catalog evidence
        run: npm run test:staging
        env:
          YWI_RUN_STAGING_RPC_TESTS: ${{ secrets.YWI_RUN_STAGING_RPC_TESTS }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          YWI_STAGING_PROJECT_REF: ${{ secrets.YWI_STAGING_PROJECT_REF }}
          YWI_PRODUCTION_PROJECT_REF: jmqvkgiqlimdhcofwkxr
          YWI_STAGING_LABEL: staging
          YWI_STAGING_CONFIRM: I_CONFIRM_STAGING_ONLY
          YWI_STAGING_JOB_ADMIN_PROFILE_ID: ${{ secrets.YWI_STAGING_JOB_ADMIN_PROFILE_ID }}
          YWI_STAGING_JOB_ADMIN_JWT: ${{ secrets.YWI_STAGING_JOB_ADMIN_JWT }}
          YWI_STAGING_WORKER_JWT: ${{ secrets.YWI_STAGING_WORKER_JWT }}
          YWI_STAGING_SOURCE_SHA: ${{ github.sha }}
          YWI_STAGING_WORKFLOW_RUN_ID: ${{ github.run_id }}
          YWI_STAGING_TARGET_RAIL: ${{ inputs.target_rail }}
          YWI_STAGING_CREATE_FIXTURES: ${{ inputs.create_fixtures == 'true' && '1' || '0' }}
          YWI_STAGING_FIXTURE_LABEL: STAGING-B187-RUN
