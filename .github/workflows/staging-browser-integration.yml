  repository-enforcement:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Require GitHub repository enforcement on exact main
        env:
          GH_TOKEN: ${{ github.token }}
          YWI_GITHUB_EVENT_NAME: ${{ github.event_name }}
          YWI_GITHUB_REF: ${{ github.ref }}
          YWI_EXPECTED_MAIN_SHA: ${{ github.sha }}
        run: |
          main_json="$(gh api "repos/${GITHUB_REPOSITORY}/branches/main")"
          export YWI_GITHUB_MAIN_SHA="$(printf '%s' "$main_json" | jq -r '.commit.sha // empty')"
          export YWI_GITHUB_MAIN_PROTECTED="$(printf '%s' "$main_json" | jq -r 'if has("protected") then (.protected|tostring) else "" end')"
          npm run repository:protection:require

  release-source-evidence:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: source-checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Re-verify exact main and write release-source candidate
        env:
          GH_TOKEN: ${{ github.token }}
          YWI_GITHUB_EVENT_NAME: ${{ github.event_name }}
          YWI_GITHUB_REF: ${{ github.ref }}
          YWI_GITHUB_REPOSITORY: ${{ github.repository }}
          YWI_EXPECTED_MAIN_SHA: ${{ github.sha }}
          YWI_GITHUB_RUN_ID: ${{ github.run_id }}
          YWI_GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
          YWI_GITHUB_WORKFLOW_NAME: ${{ github.workflow }}
          YWI_SOURCE_CHECKS_RESULT: ${{ needs.source-checks.result }}
          YWI_RELEASE_EVIDENCE_PATH: release-source-evidence.json
        run: |
          main_json="$(gh api "repos/${GITHUB_REPOSITORY}/branches/main")"
          export YWI_GITHUB_MAIN_SHA="$(printf '%s' "$main_json" | jq -r '.commit.sha // empty')"
          export YWI_GITHUB_MAIN_PROTECTED="$(printf '%s' "$main_json" | jq -r 'if has("protected") then (.protected|tostring) else "" end')"
          npm run repository:protection:require
          npm run release:evidence:write
      - name: Upload exact-main release-source candidate
        uses: actions/upload-artifact@v4
        with:
          name: ywi-main-release-source-${{ github.run_id }}-${{ github.run_attempt }}
          path: release-source-evidence.json
          if-no-files-found: error

  release-truth-summary:
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [source-checks, repository-enforcement, release-source-evidence]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Summarize exact-main application and control truth
        env:
          YWI_GITHUB_EVENT_NAME: ${{ github.event_name }}
          YWI_GITHUB_REF: ${{ github.ref }}
          YWI_GITHUB_REPOSITORY: ${{ github.repository }}
          YWI_HEAD_SHA: ${{ github.sha }}
          YWI_GITHUB_RUN_ID: ${{ github.run_id }}
          YWI_GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
          YWI_SOURCE_CHECKS_RESULT: ${{ needs.source-checks.result }}
          YWI_REPOSITORY_ENFORCEMENT_RESULT: ${{ needs.repository-enforcement.result }}
          YWI_RELEASE_SOURCE_EVIDENCE_RESULT: ${{ needs.release-source-evidence.result }}
          YWI_EXACT_MAIN_RELEASE_TRUTH_PATH: exact-main-release-truth-summary.json
        run: node scripts/exact-main-release-truth-summary.mjs
      - name: Upload exact-main release truth summary
        uses: actions/upload-artifact@v4
        with:
          name: ywi-main-release-truth-${{ github.run_id }}-${{ github.run_attempt }}
          path: exact-main-release-truth-summary.json
          if-no-files-found: error

  staging-proof:
    if: github.event_name == 'workflow_dispatch' && inputs.run_staging == 'true'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Verify exact staging target identity
        run: npm run staging:preflight
        env:
          YWI_RUN_STAGING_RPC_TESTS: ${{ secrets.YWI_RUN_STAGING_RPC_TESTS }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          YWI_STAGING_PUBLIC_KEY: ${{ secrets.YWI_STAGING_PUBLIC_KEY }}
          YWI_STAGING_PROJECT_REF: ${{ secrets.YWI_STAGING_PROJECT_REF }}
          YWI_STAGING_JOB_ADMIN_PROFILE_ID: ${{ secrets.YWI_STAGING_JOB_ADMIN_PROFILE_ID }}
          YWI_STAGING_TARGET_RAIL: ${{ inputs.target_rail }}
          YWI_STAGING_LABEL: staging
          YWI_STAGING_CONFIRM: I_CONFIRM_STAGING_ONLY
          YWI_PRODUCTION_PROJECT_REF: jmqvkgiqlimdhcofwkxr
      - name: Run current-schema staging catalog evidence
        run: npm run test:staging
        env:
          YWI_RUN_STAGING_RPC_TESTS: ${{ secrets.YWI_RUN_STAGING_RPC_TESTS }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          YWI_STAGING_PUBLIC_KEY: ${{ secrets.YWI_STAGING_PUBLIC_KEY }}
          YWI_STAGING_PROJECT_REF: ${{ secrets.YWI_STAGING_PROJECT_REF }}
          YWI_PRODUCTION_PROJECT_REF: jmqvkgiqlimdhcofwkxr
          YWI_STAGING_LABEL: staging
          YWI_STAGING_CONFIRM: I_CONFIRM_STAGING_ONLY
          YWI_STAGING_JOB_ADMIN_PROFILE_ID: ${{ secrets.YWI_STAGING_JOB_ADMIN_PROFILE_ID }}
          YWI_STAGING_JOB_ADMIN_JWT: ${{ secrets.YWI_STAGING_JOB_ADMIN_JWT }}
          YWI_STAGING_WORKER_JWT: ${{ secrets.YWI_STAGING_WORKER_JWT }}
          YWI_STAGING_SOURCE_SHA: ${{ github.sha }}
          YWI_STAGING_WORKFLOW_RUN_ID: ${{ github.run_id }}
          YWI_STAGING_TARGET_RAIL: ${{ inputs.target_rail }}
          YWI_STAGING_CREATE_FIXTURES: ${{ inputs.create_fixtures == 'true' && '1' || '0' }}
          YWI_STAGING_FIXTURE_LABEL: STAGING-CURRENT-RUN
