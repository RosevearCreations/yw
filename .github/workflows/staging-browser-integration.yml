name: YWI source and staging checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_staging:
        description: 'Run staging-only integration proof'
        required: false
        default: 'false'
        type: choice
        options: ['false','true']
      target_rail:
        description: 'Current-schema staging acceptance rail (Schema 187 catalog)'
        required: false
        default: 'operations_cockpit_live'
        type: choice
        options:
          - operations_cockpit_live
          - quote_intake_live
          - live_job_updates
          - customer_live_update_notifications
          - service_execution_proof_costing
          - supervisor_closeout_signoff_invoice_followup
      create_fixtures:
        description: 'Create and clean disposable STAGING fixtures during the runner phase'
        required: false
        default: 'false'
        type: choice
        options: ['false','true']

jobs:
  source-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Verify Vercel production static output
        run: npm run test:vercel-static-output
      - name: Validate Development / Production promotion shape
        env:
          YWI_GITHUB_EVENT_NAME: ${{ github.event_name }}
          YWI_GITHUB_REF: ${{ github.ref }}
          YWI_GITHUB_BASE_REF: ${{ github.base_ref }}
          YWI_GITHUB_HEAD_REF: ${{ github.head_ref }}
        run: npm run promotion:shape:require
